# boox - built from the official images and their compose examples (audiobookshelf, grimmory, bookkeep, readmeabook)
# adapted: pinned images, data paths, host ports (secrets in .env)
name: boox
services:
  # ----------------------------------------------------------
  # AUDIOBOOKSHELF — audiobook & podcast server
  # ----------------------------------------------------------
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.37.2@sha256:b897c33f05972fb1bf484f7487bc878fa91ec8691335c1db6e2929c3a7658efa
    container_name: audiobookshelf
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Europe/Berlin"
    volumes:
      - /media/mainpool/media/audiobooks:/audiobooks
      - /media/mainpool/media/podcasts:/podcasts
      - /srv/appdata/audiobookshelf/config:/config
      - /srv/appdata/audiobookshelf/metadata:/metadata
    ports:
      - "${AUDIOBOOKSHELF_PORT}:80"
    networks:
      - books-net
  # ----------------------------------------------------------
  # GRIMMORY — ebook library (Booklore-based, MariaDB only)
  # ----------------------------------------------------------
  grimmory:
    image: grimmory/grimmory:v3.5.0@sha256:bf6fe21c6e247597f7869664a440b5a34242e2d2940575cae39c17bfaa66dc0b
    container_name: grimmory
    restart: unless-stopped
    depends_on:
      grimmory-db:
        condition: service_healthy
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Europe/Berlin"
      DATABASE_URL: "jdbc:mariadb://grimmory-db:3306/grimmory"
      DATABASE_USERNAME: "grimmory"
      DATABASE_PASSWORD: "${DATABASE_PASSWORD}"
      OIDC_ALLOW_UNSAFE_HOSTS: "true"
    volumes:
      - /srv/appdata/grimmory/data:/app/data
      - /srv/appdata/grimmory/books:/books
      - /srv/appdata/grimmory/bookdrop:/bookdrop
    ports:
      - "${GRIMMORY_PORT}:6060"
    networks:
      - books-net
  grimmory-db:
    image: lscr.io/linuxserver/mariadb:11.8.9@sha256:cc9c523dead7690487d5892419b5c513c78bf398fe03b115e43a652ab75a237c
    container_name: grimmory-db
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Europe/Berlin"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "grimmory"
      MYSQL_USER: "grimmory"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
    volumes:
      - /srv/appdata/grimmory-db:/config
    networks:
      - books-net
  # ----------------------------------------------------------
  # BOOKKEEP — book discovery & requests → Grimmory
  # ----------------------------------------------------------
    healthcheck:
      test:
        - CMD
        - mariadb-admin
        - ping
        - -h
        - localhost
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s
  bookkeep:
    image: akiraslingshot/bookkeep:latest@sha256:a6ff240d1e1470b200feec0d7b094fff767c6b32dec9b6bb036bbf304389b4f6
    container_name: bookkeep
    restart: unless-stopped
    depends_on:
      bookkeep-db:
        condition: service_healthy
      bookkeep-redis:
        condition: service_started
      grimmory:
        condition: service_started
    environment:
      TZ: "Europe/Berlin"
      DATABASE_URL: "postgresql://bookkeep:${POSTGRES_PASSWORD}@bookkeep-db:5432/bookkeep_db"
      REDIS_URL: "redis://bookkeep-redis:6379/0"
      HARDCOVER_API_TOKEN: "${HARDCOVER_API_TOKEN}"
      BOOKKEEP_SECRET_KEY: "${BOOKKEEP_SECRET_KEY}"
    volumes:
      - /srv/appdata/bookkeep:/config
      - /srv/appdata/grimmory/books:/downloads/ebooks
      - /srv/appdata/grimmory/bookdrop:/downloads/bookdrop
      - /media/mainpool/media/downloads/torrents:/downloads/torrents
    ports:
      - "${BOOKKEEP_PORT}:8000"
    networks:
      - books-net
      - mediastack
  bookkeep-db:
    image: postgres:16-alpine@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
    container_name: bookkeep-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: "bookkeep_db"
      POSTGRES_USER: "bookkeep"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - /srv/appdata/bookkeep-db:/var/lib/postgresql/data
    networks:
      - books-net
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U bookkeep -d bookkeep_db
      interval: 10s
      timeout: 5s
      retries: 5
  bookkeep-redis:
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    container_name: bookkeep-redis
    restart: unless-stopped
    volumes:
      - /srv/appdata/bookkeep-redis:/data
    networks:
      - books-net
  # ----------------------------------------------------------
  # READMEABOOK — audiobook requests → Audiobookshelf
  # ----------------------------------------------------------
  readmeabook:
    image: ghcr.io/kikootwo/readmeabook:1.3.0@sha256:3c4e18563b3e22c7b67bcf3b323e81fda840159ea6c71eee91ab13a2d49b0cf1
    container_name: readmeabook
    restart: unless-stopped
    depends_on:
      - audiobookshelf
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Europe/Berlin"
      PUBLIC_URL: "http://localhost:3030"
    volumes:
      - /srv/appdata/readmeabook/config:/app/config
      - /srv/appdata/readmeabook/cache:/app/cache
      - /srv/appdata/readmeabook/postgres:/var/lib/postgresql/data
      - /srv/appdata/readmeabook/redis:/var/lib/redis
      - /media/mainpool/media/downloads/torrents:/downloads
      - /media/mainpool/media/audiobooks:/media
    ports:
      - "${READMEABOOK_PORT}:3030"
    networks:
      - books-net
      - mediastack
networks:
  books-net:
    driver: bridge
  mediastack:
    external: true
