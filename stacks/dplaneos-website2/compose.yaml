# dplaneos-website2 - own project, compose file from its repository
# adapted: pinned images, data paths, host ports (secrets in .env)
name: dplaneos-website2
services:
  d-planeos-website:
    image: nginx:alpine@sha256:fed7e14be83cbd2661a75cdc5b872d936cf155d46c327084d30b8df19ae88d72
    container_name: dplaneos-website
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: "Europe/Berlin"
      GITHUB_USERNAME: "${GITHUB_USERNAME:-yourusername}"
      WEBSITE_DOMAIN: "${WEBSITE_DOMAIN:-your-domain.com}"
    volumes:
      - /media/mainpool/websites/dplaneos-website/website:/usr/share/nginx/html:rw
      - /media/mainpool/websites/dplaneos-website/docker-nginx.conf:/etc/nginx/conf.d/default.conf:rw
    ports:
      - "${D_PLANEOS_WEBSITE_PORT}:80"
    networks:
      - web
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://localhost/
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
networks:
  web:
    name: web
    external: false
