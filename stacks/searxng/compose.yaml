# searxng - based on the official compose file (searxng/searxng-docker): searxng + valkey (cache)
# adapted: pinned images, host port 8888, data paths; no caddy (LAN only, no TLS proxy)
name: searxng
services:
  valkey:
    image: valkey/valkey:8.1.11-alpine@sha256:2602ace2be6569bc2bbb06f873776516ab9089821525be34f4305c67eb9db02a
    container_name: valkey
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    volumes:
      - /srv/appdata/searxng/valkey:/data
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    logging: &id001
      driver: json-file
      options:
        max-size: 1m
        max-file: "1"
  searxng:
    image: searxng/searxng:2026.7.22-ef8f6470e@sha256:854f239d5c181db9c4282cd0ffc1737a61232dd6ad0ea964028b96df17d7758a
    container_name: searxng
    restart: unless-stopped
    ports:
      - "${SEARXNG_PORT}:8080"
    volumes:
      - /srv/appdata/searxng/config:/etc/searxng
    environment:
      SEARXNG_BASE_URL: https://search.example.com/
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging: *id001
    depends_on:
      - valkey
