# traefik-internal - official traefik image with own configuration (config/traefik.yml; config/dynamic/routes.yml generated by gen.py)
# adapted: pinned image, host port 443, certificates under /srv/appdata (secrets in .env)
name: traefik-internal
services:
  traefik:
    image: traefik:v3.7@sha256:b7b1b31e6440de0b1f7c4e0f6cf0a0f3f004866761d30c025fe00c80daaf7d9c
    container_name: traefik-internal
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./config:/etc/traefik:ro   # folder mount: git replaces files, single-file mounts would keep the old version
      - /srv/appdata/traefik-internal/letsencrypt:/letsencrypt
    ports:
      - "${TRAEFIK_PORT}:443"
