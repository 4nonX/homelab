# pihole - based on the official compose file (pi-hole/docker-pi-hole README)
# adapted: pinned image, web UI on host ports 8800/8443, data path (password in .env)
name: pihole
services:
  pihole:
    image: pihole/pihole:2026.11.0@sha256:52762e1620160b1e8cb3e12c585d0d0b0df901395c2bad6b514db379e526a9fb
    container_name: pihole
    restart: unless-stopped
    ports:
      - "${PIHOLE_PORT_53}:53/tcp"
      - "${PIHOLE_PORT_53}:53/udp"
      - "${PIHOLE_PORT_80}:80/tcp"
      - "${PIHOLE_PORT_443}:443/tcp"
    environment:
      TZ: Europe/Berlin
      FTLCONF_webserver_api_password: ${FTLCONF_webserver_api_password}
      FTLCONF_dns_listeningMode: all
    volumes:
      - /srv/appdata/pihole:/etc/pihole
    cap_add:
      - NET_ADMIN
