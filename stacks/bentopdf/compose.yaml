# bentopdf - based on the official compose example (alam00000/bentopdf)
# adapted: pinned image, host port 8787
name: bentopdf
services:
  bentopdf:
    image: ghcr.io/alam00000/bentopdf:2.8.11@sha256:b107c37d9f1f27b7edae28d262e526d8e225541a7cc26005b84dbab42c904105
    container_name: bentopdf
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      SECRET_KEY: "${SECRET_KEY}"
    volumes:
      - /srv/appdata/bentopdf/data:/app/data
    ports:
      - "${BENTOPDF_PORT}:8080"
