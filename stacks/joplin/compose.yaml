# joplin - based on the official compose file (laurent22/joplin docker-compose.server.yml)
# adapted: pinned images, data path, public URL, no published database port (secrets in .env)
name: joplin
services:
  db:
    image: postgres:14.25@sha256:c0e9c0e9bac7e4c1834b698217a03ee5c708de30d313c84a506972de0e24b059
    volumes:
      - /srv/appdata/joplin/postgresql/data:/var/lib/postgresql/data
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: joplin
      POSTGRES_DB: joplin
  app:
    image: joplin/server:3.7.5@sha256:2bf372c0eac43a3bd47440b7b3044feefe3423eb33649a836eb8d9499934b3b3
    depends_on:
      - db
    ports:
      - "${APP_PORT}:22300"
    restart: unless-stopped
    environment:
      APP_PORT: 22300
      APP_BASE_URL: https://joplin.example.com
      DB_CLIENT: pg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DATABASE: joplin
      POSTGRES_USER: joplin
      POSTGRES_PORT: 5432
      POSTGRES_HOST: db
      MAX_TIME_DRIFT: 0
