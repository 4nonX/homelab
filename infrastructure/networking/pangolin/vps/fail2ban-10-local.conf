# local settings; Ubuntu defaults stay in jail.conf / jail.d/defaults-debian.conf
[DEFAULT]
ignoreip = 127.0.0.1/8 ::1 100.64.0.0/10 fd7a:115c:a1e0::/48
bantime = 10m
bantime.increment = true
bantime.factor = 2
bantime.maxtime = 1w
findtime = 10m
maxretry = 10

[sshd]
enabled = true
mode = aggressive
