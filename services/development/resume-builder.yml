services:
  postgres:
    image: postgres:16-alpine
    container_name: resume-builder-db
    environment:
      POSTGRES_USER: resume_builder
      POSTGRES_PASSWORD: ${RESUME_BUILDER_DB_PASSWORD}
      POSTGRES_DB: resume_builder
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    networks:
      - resume-builder-network
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: resume-builder-backend
    environment:
      DATABASE_URL: postgresql://resume_builder:${RESUME_BUILDER_DB_PASSWORD}@postgres:5432/resume_builder
      JWT_SECRET: ${RESUME_BUILDER_JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      UPLOAD_DIR: /uploads
      FRONTEND_URL: ${RESUME_BUILDER_FRONTEND_URL:-http://localhost:3000}
    volumes:
      - ./uploads:/uploads
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    networks:
      - resume-builder-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: resume-builder-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${RESUME_BUILDER_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - resume-builder-network
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: resume-builder-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - resume-builder-network
    restart: unless-stopped

networks:
  resume-builder-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
