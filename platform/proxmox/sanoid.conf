# ZFS snapshots for mainpool (datasets named per purpose, 2026-11-15).
# Snapshots protect against mistakes and ransomware inside the pool; they are not an off-site backup.

[mainpool/nextcloud-data]
	use_template = important
[mainpool/immich-library]
	use_template = important
[mainpool/vm]
	use_template = important
	recursive = yes
[mainpool/backups]
	use_template = important
	recursive = yes
[mainpool/websites]
	use_template = important

[mainpool/documents]
	use_template = daily

# media: library + downloads; short retention so deleted downloads do not linger
[mainpool/media]
	use_template = short

[template_important]
	frequently = 0
	hourly = 48
	daily = 30
	weekly = 0
	monthly = 6
	yearly = 0
	autosnap = yes
	autoprune = yes

[template_daily]
	frequently = 0
	hourly = 0
	daily = 30
	weekly = 0
	monthly = 6
	yearly = 0
	autosnap = yes
	autoprune = yes

[template_short]
	frequently = 0
	hourly = 0
	daily = 14
	weekly = 0
	monthly = 0
	yearly = 0
	autosnap = yes
	autoprune = yes
